<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation - École LES RAMPARDS</title>
    <style>
        :root { --navy: #12355b; --teal: #2a9d8f; --ink: #263238; --paper: #f4f7f6; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: Arial, sans-serif; color: var(--ink); background: var(--paper); }
        header { background: var(--navy); padding: 16px 20px; }
        nav { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        nav strong, nav a { color: white; text-decoration: none; }
        nav ul { display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
        main { max-width: 900px; margin: 0 auto; padding: 28px 20px; }
        h1, h2 { color: var(--navy); text-align: center; margin: 0 0 8px; }
        .intro { margin: 0 0 20px; }
        .panel { background: white; padding: 22px; border-radius: 10px; box-shadow: 0 4px 14px rgba(18, 53, 91, .12); }
        .search { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
        label { display: grid; gap: 6px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; border: 1px solid #cbd5d7; border-radius: 5px; font: inherit; }
        button { min-height: 44px; padding: 11px 18px; border: 0; border-radius: 5px; background: var(--navy); color: white; font: inherit; font-weight: bold; cursor: pointer; transition: background-color .2s ease, transform .2s ease; }
        button:hover { background: #238276; }
        .role { max-width: 300px; margin: 0 auto 16px; }
        .director-login { display: grid; grid-template-columns: 1fr auto; gap: 10px; max-width: 500px; margin: 0 auto 18px; }
        .director-login label { align-content: end; }
        .director-login button { background: var(--teal); }
        .status { min-height: 24px; margin: 14px 0 0; font-weight: bold; }
        .chat { display: none; margin-top: 18px; }
        .student { color: var(--navy); margin: 0 0 12px; }
        .messages { height: 320px; overflow-y: auto; border: 1px solid #dce5e3; border-radius: 7px; padding: 14px; background: #f8fbfa; }
        .message { max-width: 78%; margin: 0 0 10px; padding: 9px 12px; border-radius: 10px; background: #e4eeec; }
        .message.parent { margin-left: auto; background: #d8e6f3; }
        .message small { display: block; margin-top: 4px; opacity: .65; font-size: 11px; }
        .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 12px; }
        @media (max-width: 650px) { .search, .composer { grid-template-columns: 1fr; } nav { align-items: flex-start; flex-direction: column; } }
    </style>
    <link rel="stylesheet" href="site-ui.css">
</head>
<body>
    <header>
        <nav>
            <strong>École LES RAMPARDS</strong>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="responsables.html">Responsables</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Conversation avec l'école</h1>
        <p class="intro">Le parent recherche son enfant avec son nom, puis envoie son message.</p>
        <section class="panel">
            <form id="director-login" class="director-login">
                <label>Connexion direction
                    <input id="director-password" type="password" placeholder="Mot de passe" required>
                </label>
                <button type="submit">Se connecter</button>
            </form>
            <form id="student-search" class="search">
                <label>Nom de l'enfant<input id="last-name" required autocomplete="family-name"></label>
                <button type="submit">Rechercher</button>
            </form>
            <p id="status" class="status" role="status"></p>
            <div id="chat" class="chat">
                <h2 id="student-name" class="student"></h2>
                <div id="messages" class="messages" aria-live="polite"></div>
                <form id="message-form" class="composer">
                    <input id="message-input" placeholder="Écrivez votre message..." maxlength="2000" required>
                    <button type="submit">Envoyer</button>
                </form>
            </div>
        </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const searchForm = document.getElementById('student-search');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat');
        const messages = document.getElementById('messages');
        const studentName = document.getElementById('student-name');
        let studentId = null;
        let directorToken = null;

        document.getElementById('director-login').addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('director-password').value;
            try {
                const response = await fetch('/api/director/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Connexion refusée');
                directorToken = result.token;
                socket.auth = { directorToken };
                socket.disconnect().connect();
                if (studentId) socket.emit('conversation:join', studentId);
                status.textContent = 'Connexion direction réussie.';
                document.getElementById('director-password').value = '';
            } catch (error) {
                status.textContent = error.message;
            }
        });

        function showMessage(item) {
            const element = document.createElement('div');
            element.className = `message ${item.sender}`;
            element.textContent = item.message;
            const time = document.createElement('small');
            time.textContent = new Date(item.created_at).toLocaleString('fr-FR');
            element.appendChild(time);
            messages.appendChild(element);
            messages.scrollTop = messages.scrollHeight;
        }

        searchForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            status.textContent = 'Recherche en cours...';
            chat.style.display = 'none';
            const params = new URLSearchParams({ nom: document.getElementById('last-name').value.trim() });
            try {
                const response = await fetch(`/api/eleves?${params}`);
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Élève introuvable');
                studentId = result.eleve.id;
                studentName.textContent = `Conversation : ${result.eleve.prenom} ${result.eleve.nom}`;
                messages.innerHTML = '';
                if (directorToken) {
                    const history = await fetch(`/api/conversations/${studentId}/messages`, {
                        headers: { Authorization: `Bearer ${directorToken}` }
                    });
                    const historyResult = await history.json();
                    historyResult.messages.forEach(showMessage);
                    socket.emit('conversation:join', studentId);
                } else {
                    socket.emit('conversation:join', studentId);
                }
                chat.style.display = 'block';
                status.textContent = '';
            } catch (error) {
                status.textContent = error.message;
            }
        });

        document.getElementById('message-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const input = document.getElementById('message-input');
            if (!studentId || !input.value.trim()) return;
            socket.emit('conversation:message', {
                eleveId: studentId,
                sender: directorToken ? 'direction' : 'parent',
                message: input.value
            });
            input.value = '';
        });

        socket.on('conversation:message', showMessage);
        socket.on('conversation:error', (message) => { status.textContent = message; });
    </script>
</body>
</html>
